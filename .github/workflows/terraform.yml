name: Terraform CI/CD

on:
  push:
    branches:
      - dev
      - qa
      - prod
  pull_request:
    branches:
      - dev
      - qa
      - prod

env:
  AWS_REGION: us-east-1

jobs:
  terraform-dev:
    name: Terraform Dev
    runs-on: ubuntu-latest
    environment: dev
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.base_ref == 'dev')

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:dev-${{ github.sha }} ${{ github.workspace }}/app
      
      - name: Push Docker Image to ECR
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:dev-${{ github.sha }}

      - name: Deploy to EC2
        if: github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_DEV_HOST }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: dev-${{ github.sha }}
          AWS_REGION: us-east-1
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$EC2_HOST << EOF
            # Login to ECR using full path
            /usr/local/bin/aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Stop and remove existing container
            docker stop fastapi || true
            docker rm fastapi || true

            # Pull latest image
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # Run new container
            docker run -d -p 8000:8000 --restart always --name fastapi $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          EOF
          rm -f key.pem
      
      - name: Show App URL
        if: github.event_name == 'push'
        run: terraform output application_url

  terraform-qa:
    name: Terraform QA
    runs-on: ubuntu-latest
    environment: qa
    if: github.ref == 'refs/heads/qa' || (github.event_name == 'pull_request' && github.base_ref == 'qa')

    defaults:
      run:
        working-directory: environments/qa

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve
      
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:qa-${{ github.sha }} ${{ github.workspace }}/app
      
      - name: Push Docker Image to ECR
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:qa-${{ github.sha }}

      - name: Deploy to EC2
        if: github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_QA_HOST }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: qa-${{ github.sha }}
          AWS_REGION: us-east-1
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$EC2_HOST << EOF
            # Login to ECR using full path
            /usr/local/bin/aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Stop and remove existing container
            docker stop fastapi || true
            docker rm fastapi || true

            # Pull latest image
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # Run new container
            docker run -d -p 8000:8000 --restart always --name fastapi $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          EOF
          rm -f key.pem

      - name: Show App URL
        if: github.event_name == 'push'
        run: terraform output application_url

  terraform-prod:
    name: Terraform Prod
    runs-on: ubuntu-latest
    environment: prod
    if: github.ref == 'refs/heads/prod' || (github.event_name == 'pull_request' && github.base_ref == 'prod')

    defaults:
      run:
        working-directory: environments/prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:prod-${{ github.sha }} ${{ github.workspace }}/app

      - name: Push Docker Image to ECR
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:prod-${{ github.sha }}

      - name: Deploy to EC2
        if: github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_PROD_HOST }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: prod-${{ github.sha }}
          AWS_REGION: us-east-1
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$EC2_HOST << EOF
            # Login to ECR using full path
            /usr/local/bin/aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Stop and remove existing container
            docker stop fastapi || true
            docker rm fastapi || true

            # Pull latest image
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # Run new container
            docker run -d -p 8000:8000 --restart always --name fastapi $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          EOF
          rm -f key.pem
          
      - name: Show App URL
        if: github.event_name == 'push'
        run: terraform output application_url

      - name: Terraform Destroy
        if: github.event_name == 'push'
        run: terraform destroy -auto-approve
